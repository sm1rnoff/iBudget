<section class="card" aria-labelledby="trend-title">
  <h2 id="trend-title">Last {{ trend | length }} months</h2>
  <ol class="trend">
    {% for point in trend %}
    <li class="trend-item{% if point.month == month %} current{% endif %}">
      <a href="{{ page_url(point.month) }}" hx-get="/partials/month?month={{ point.month }}" hx-target="#month"
         title="{{ point.month.label }}: {{ point.total_cents | money }} {{ currency }}">
        <span class="trend-value">{{ point.total_cents | money }}</span>
        <span class="trend-track"><span class="trend-fill" style="height: {{ (point.total_cents * 100 / trend_max) | round(1) }}%"></span></span>
        <span class="trend-label">{{ point.month.start.strftime("%b") }}</span>
      </a>
    </li>
    {% endfor %}
  </ol>
</section>
